
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ovoziya — Audiokitoblar olami</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }
    header {
      padding: 22px 6%;
      background: #0b1220;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo { color: #43e59b; font-size: 28px; font-weight: bold; }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }
    .hero {
      padding: 75px 7%;
      text-align: center;
      background:
        linear-gradient(#07111ddd, #07111ddd),
        url("https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=1600");
      background-size: cover;
      background-position: center;
    }
    .hero h1 { font-size: 42px; margin-bottom: 12px; }
    .hero p { color: #d0d9e5; font-size: 18px; }
    .green { color: #43e59b; }
    .search {
      display: block;
      width: min(90%, 500px);
      margin: 25px auto;
      padding: 14px;
      border: 1px solid #43e59b;
      border-radius: 10px;
      background: #202d40;
      color: white;
      font-size: 16px;
    }
    main { padding: 30px 6%; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0;
    }
    button {
      background: #43e59b;
      color: #101827;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .filters button { background: #26364b; color: white; }
    .filters button.active { background: #43e59b; color: #101827; }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 20px;
    }
    .book {
      background: #202d40;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #304158;
    }
    .book img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 9px;
    }
    .book h3 { margin-bottom: 8px; }
    .price { color: #43e59b; font-weight: bold; }
    audio { width: 100%; margin: 10px 0; }
    .download {
      display: inline-block;
      margin-top: 8px;
      color: #43e59b;
    }
    footer {
      text-align: center;
      padding: 25px;
      background: #0b1220;
      color: #aab6c7;
    }
    @media(max-width: 600px) {
      .hero h1 { font-size: 30px; }
      nav a { margin-left: 8px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">🎧 Ovoziya</div>
  <nav>
    <a href="#home">Bosh sahifa</a>
    <a href="#library">Kutubxona</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Ovoziya — <span class="green">Audiokitoblar olami</span></h1>
  <p>Sevimli hikoyalaringizni tinglang va yangi olamlarni kashf eting.</p>
  <a href="#library"><button>Kitoblarni ko‘rish</button></a>
</section>

<main id="library">
  <h2>📚 Audiokitoblar kutubxonasi</h2>

  <input class="search" id="search"
    type="search" placeholder="Kitob nomini qidiring...">

  <div class="filters">
    <button class="active" onclick="filterBooks('Barchasi', this)">Barchasi</button>
    <button onclick="filterBooks('Hikoya', this)">Hikoyalar</button>
    <button onclick="filterBooks('Sayohat', this)">Sayohat</button>
    <button onclick="filterBooks('Hayot', this)">Hayotiy</button>
  </div>

  <div class="books" id="books"></div>
</main>

<footer>
  <p>© 2026 Ovoziya — Audiokitoblar do‘koni</p>
  <p>Kitob tinglang, bilim oling!</p>
</footer>

<script>
const books = [
  {
    title: "Maqsad sari qo‘yilgan qadamlar",
    genre: "Hayot",
    image: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500",
    audio: "audio/maqsad.mp3"
  },
  {
    title: "Xavfli sayohat",
    genre: "Sayohat",
    image: "https://images.unsplash.com/photo-1476275466078-4007374efbbe?w=500",
    audio: "audio/xavfli.mp3"
  },
  {
    title: "Xush kelibsan, kuz",
    genre: "Hikoya",
    image: "https://images.unsplash.com/photo-1507842217343-583bb7270b66?w=500",
    audio: "audio/kuz.mp3"
  },
  {
    title: "Poyezddagi so‘nggi bekat",
    genre: "Hikoya",
    image: "https://images.unsplash.com/photo-1474487548417-781cb71495f3?w=500",
    audio: "audio/poyezd.mp3"
  },
  {
    title: "Qalbimdagi xavf-xatarlar",
    genre: "Hikoya",
    image: "https://images.unsplash.com/photo-1519682337058-a94d519337bc?w=500",
    audio: "audio/qalbim.mp3"
  },
  {
    title: "Muzlatilgan orzular",
    genre: "Hayot",
    image: "https://images.unsplash.com/photo-1511497584788-876760111969?w=500",
    audio: "audio/orzular.mp3"
  },
  {
    title: "Taqdir sinovlari",
    genre: "Hayot",
    image: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=500",
    audio: "audio/taqdir.mp3"
  }
];

let selectedGenre = "Barchasi";

function showBooks() {
  const search = document.getElementById("search").value.toLowerCase();
  const container = document.getElementById("books");

  const filtered = books.filter(book =>
    book.title.toLowerCase().includes(search) &&
    (selectedGenre === "Barchasi" || book.genre === selectedGenre)
  );

  container.innerHTML = filtered.map(book => `
    <article class="book">
      <img src="${book.image}" alt="${book.title}">
      <h3>${book.title}</h3>
      <p class="price">Narxi: 5 000 so‘m</p>
      <audio controls preload="none">
        <source src="${book.audio}" type="audio/mpeg">
        Brauzeringiz audio tinglashni qo‘llab-quvvatlamaydi.
      </audio>
      <a class="download" href="${book.audio}" download>Audio yuklab olish</a>
    </article>
  `).join("");

  if (!filtered.length) {
    container.innerHTML = "<p>Kitob topilmadi.</p>";
  }
}

function filterBooks(genre, button) {
  selectedGenre = genre;
  document.querySelectorAll(".filters button").forEach(btn =>
    btn.classList.remove("active")
  );
  button.classList.add("active");
  showBooks();
}

document.getElementById("search").addEventListener("input", showBooks);
showBooks();
</script>

</body>
</html>
