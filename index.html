<!DOCTYPE html>
<html lang="uz" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovoziya - Audio Kitoblar Platformasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 h-full flex flex-col font-sans antialiased">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white font-bold text-xl shadow-md">
                    <i class="fa-solid fa-headphones-simple"></i>
                </div>
                <span class="text-xl font-bold bg-gradient-to-r from-brand-700 to-brand-500 bg-clip-text text-transparent">Ovoziya</span>
            </div>
            <div class="relative flex-1 max-w-md mx-4">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterBooks()" placeholder="Asar nomi yoki muallifni qidirish..." class="w-full pl-10 pr-4 py-2 bg-gray-100 border border-transparent rounded-full text-sm focus:outline-none focus:bg-white focus:border-brand-500 transition">
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openFavorites()" class="relative p-2 text-gray-600 hover:text-brand-600 transition">
                    <i class="fa-solid fa-heart text-xl"></i>
                    <span id="favCount" class="absolute top-0 right-0 bg-red-500 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 pb-28">
        
        <!-- Hero Banner -->
        <div class="relative bg-gradient-to-r from-emerald-800 to-brand-600 rounded-3xl p-6 sm:p-8 text-white shadow-xl mb-8 overflow-hidden">
            <div class="relative z-10 max-w-xl">
                <span class="bg-white/20 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">Yangi mavsum</span>
                <h1 class="text-2xl sm:text-4xl font-extrabold mt-3 mb-2">Eng sara o'zbekcha audio kitoblar</h1>
                <p class="text-emerald-100 text-sm sm:text-base mb-6">Sevimli asarlaringizni istalgan joyda, istalgan vaqtda tinglang.</p>
            </div>
        </div>

        <!-- Genres Filter -->
        <div class="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 no-scrollbar" id="genreContainer">
            <button onclick="filterGenre('Barchasi', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-brand-600 text-white whitespace-nowrap shadow-sm transition">Barchasi</button>
            <button onclick="filterGenre('Drama', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Drama</button>
            <button onclick="filterGenre('Adventure', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Sarguzasht</button>
            <button onclick="filterGenre('Thriller', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Triller</button>
            <button onclick="filterGenre('Family', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Oila</button>
            <button onclick="filterGenre('Romance', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Romantika</button>
            <button onclick="filterGenre('Sci-Fi', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Ilmiy-fantastik</button>
            <button onclick="filterGenre('Other-world', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Boshqa olam</button>
            <button onclick="filterGenre('Life', this)" class="genre-btn px-4 py-2 rounded-full text-sm font-medium bg-white text-gray-600 border border-gray-200 whitespace-nowrap hover:bg-gray-100 transition">Hayotiy</button>
        </div>

        <!-- Books Grid -->
        <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6">
            <!-- Dynamically populated -->
        </div>
    </main>

    <!-- Persistent Audio Player Bar -->
    <div id="audioPlayerBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-3 z-45 hidden">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3 overflow-hidden">
                <div id="playerCover" class="w-12 h-12 rounded-lg bg-brand-500 flex items-center justify-center text-white text-lg font-bold shrink-0">🎧</div>
                <div class="truncate">
                    <h4 id="playerTitle" class="text-sm font-bold text-gray-900 truncate">Asar nomi</h4>
                    <p id="playerAuthor" class="text-xs text-gray-500 truncate">Muallif</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="togglePlayPause()" class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center hover:bg-brand-700 transition shadow">
                    <i id="playPauseIcon" class="fa-solid fa-play"></i>
                </button>
                <button onclick="closePlayer()" class="text-gray-400 hover:text-gray-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
        </div>
        <audio id="audioElement" src="saodat-preview (3).wav" onended="onAudioEnded()"></audio>
    </div>
